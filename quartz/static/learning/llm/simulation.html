<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM 3D 模拟——一个 token 的旅程</title>
    <style>
      :root {
        --bg: #161225;
        --panel: #221c38;
        --text: #ece9f7;
        --muted: #a99fc9;
        --accent: #a78bfa;
        --accent2: #7dd3fc;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      #scene {
        flex: 1;
        min-height: 0;
        position: relative;
      }
      canvas {
        display: block;
      }
      .stage-label {
        position: absolute;
        transform: translate(-50%, -100%);
        background: rgba(22, 18, 37, 0.85);
        border: 1px solid rgba(167, 139, 250, 0.55);
        color: var(--accent);
        padding: 4px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
        pointer-events: none;
      }
      #stages {
        display: flex;
        gap: 6px;
        padding: 10px 12px;
        flex-wrap: wrap;
        justify-content: center;
        background: var(--panel);
      }
      .stage-pill {
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 13px;
        background: #2f2749;
        color: var(--muted);
        cursor: pointer;
        border: 1px solid transparent;
        transition: all 0.2s;
      }
      .stage-pill.active {
        background: var(--accent);
        color: #161225;
        font-weight: 600;
      }
      #panel {
        padding: 12px 16px;
        background: var(--panel);
        border-top: 1px solid #382e58;
      }
      #panel h2 {
        font-size: 16px;
        margin-bottom: 4px;
        color: var(--accent);
      }
      #panel p {
        font-size: 13px;
        line-height: 1.55;
        color: var(--muted);
      }
      #panel a {
        color: var(--accent2);
        text-decoration: none;
      }
      #panel a:hover {
        text-decoration: underline;
      }
      #controls {
        display: flex;
        gap: 10px;
        padding: 10px 12px;
        justify-content: center;
        align-items: center;
        background: var(--panel);
      }
      button {
        padding: 8px 16px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
        background: #382e58;
        color: var(--text);
        transition: background 0.15s;
      }
      button:hover {
        background: #4a3d75;
      }
      button.primary {
        background: var(--accent);
        color: #161225;
        font-weight: 600;
      }
      button.primary:hover {
        background: #b9a5fd;
      }
      #hint {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        color: var(--muted);
        opacity: 0.8;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="scene">
      <div id="hint">拖动旋转视角 · 滚轮缩放</div>
    </div>

    <div id="stages">
      <div class="stage-pill active" data-stage="0">1 分词切割</div>
      <div class="stage-pill" data-stage="1">2 Transformer</div>
      <div class="stage-pill" data-stage="2">3 自回归生成</div>
      <div class="stage-pill" data-stage="3">4 预训练</div>
      <div class="stage-pill" data-stage="4">5 对齐调教</div>
    </div>

    <div id="panel">
      <h2 id="panel-title"></h2>
      <p id="panel-text"></p>
    </div>

    <div id="controls">
      <button id="btn-prev">上一站</button>
      <button id="btn-play" class="primary">暂停</button>
      <button id="btn-next">下一站</button>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three"
      import { OrbitControls } from "three/addons/controls/OrbitControls.js"

      /* ---------- 场景初始化 ---------- */
      const container = document.getElementById("scene")
      const scene = new THREE.Scene()
      scene.background = new THREE.Color(0x161225)
      scene.fog = new THREE.Fog(0x161225, 45, 130)

      const camera = new THREE.PerspectiveCamera(
        50,
        container.clientWidth / container.clientHeight,
        0.1,
        300,
      )
      camera.position.set(12, 12, 24)

      const renderer = new THREE.WebGLRenderer({ antialias: true })
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
      renderer.setSize(container.clientWidth, container.clientHeight)
      container.appendChild(renderer.domElement)

      const controls = new OrbitControls(camera, renderer.domElement)
      controls.target.set(0, 2, 0)
      controls.enableDamping = true
      controls.maxPolarAngle = Math.PI * 0.45
      controls.minDistance = 8
      controls.maxDistance = 55
      controls.update()

      /* 灯光：低多边形玩具感 */
      scene.add(new THREE.HemisphereLight(0xdfeaf5, 0x4a3a5a, 1.1))
      const sun = new THREE.DirectionalLight(0xfff2d9, 1.6)
      sun.position.set(18, 25, 10)
      scene.add(sun)

      /* ---------- 材质 ---------- */
      const M = {
        ground: new THREE.MeshLambertMaterial({ color: 0x2c2440 }),
        machine: new THREE.MeshLambertMaterial({ color: 0x4a3d75 }),
        tower: new THREE.MeshLambertMaterial({ color: 0x6d5aa8 }),
        towerDark: new THREE.MeshLambertMaterial({ color: 0x3b3061 }),
        teacher: new THREE.MeshLambertMaterial({ color: 0x34d399 }),
        judge: new THREE.MeshLambertMaterial({ color: 0xfbbf24 }),
        good: new THREE.MeshLambertMaterial({ color: 0x34d399 }),
        bad: new THREE.MeshLambertMaterial({ color: 0xf87171 }),
        bar: new THREE.MeshLambertMaterial({ color: 0xece9f7 }),
        data: new THREE.MeshLambertMaterial({ color: 0x7dd3fc }),
        beam: new THREE.MeshBasicMaterial({ color: 0xa78bfa, transparent: true, opacity: 0.65 }),
      }
      const TOKEN_COLORS = [0xf97316, 0x34d399, 0x60a5fa, 0xfbbf24, 0xe879f9, 0x7dd3fc, 0xf87171]

      function box(w, h, d, mat, x = 0, y = 0, z = 0, parent = scene) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat)
        m.position.set(x, y, z)
        parent.add(m)
        return m
      }
      function cyl(rt, rb, h, mat, seg = 10, x = 0, y = 0, z = 0, parent = scene) {
        const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat)
        m.position.set(x, y, z)
        parent.add(m)
        return m
      }
      function sph(r, mat, seg = 10, x = 0, y = 0, z = 0, parent = scene) {
        const m = new THREE.Mesh(new THREE.SphereGeometry(r, seg, seg), mat)
        m.position.set(x, y, z)
        parent.add(m)
        return m
      }
      function tokenMat(i) {
        return new THREE.MeshLambertMaterial({ color: TOKEN_COLORS[i % TOKEN_COLORS.length] })
      }

      /* ---------- 地面 ---------- */
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(160, 70), M.ground)
      ground.rotation.x = -Math.PI / 2
      scene.add(ground)

      /* ---------- 五个工作站 ---------- */
      const stations = [
        { x: -18, name: "分词 Tokenization", y: 7.5 },
        { x: -8, name: "Transformer 推理", y: 8.5 },
        { x: 2, name: "自回归生成", y: 7.5 },
        { x: 12, name: "预训练", y: 9.5 },
        { x: 22, name: "对齐 Alignment", y: 7.5 },
      ]

      /* 站 0：切割机 */
      const cutterBase = box(5, 0.6, 3, M.machine, -18, 0.5, 0)
      const bladeA = box(0.25, 3.2, 2.6, M.bar, -18, 3.4, 0.5)
      const bladeB = box(0.25, 3.2, 2.6, M.bar, -18, 3.4, -0.5)
      const sentenceBar = box(6, 0.9, 0.9, M.bar, -18, 6, 0)
      sentenceBar.visible = false
      const tokens0 = []
      for (let i = 0; i < 5; i++) {
        const t = box(0.95, 0.95, 0.95, tokenMat(i), -18, 3.2, 0)
        t.visible = false
        tokens0.push(t)
      }

      /* 站 1：Transformer 塔 + 注意力面板 */
      const tower1 = new THREE.Group()
      tower1.position.set(-8, 0, 0)
      for (let i = 0; i < 6; i++) {
        cyl(
          1.5 - i * 0.1,
          1.5 - i * 0.1,
          0.55,
          i % 2 ? M.tower : M.towerDark,
          12,
          0,
          0.55 + i * 0.65,
          0,
          tower1,
        )
      }
      cyl(0.2, 0.2, 0.8, M.bar, 6, 0, 4.8, 0, tower1)
      scene.add(tower1)
      const currentToken = box(0.8, 0.8, 0.8, tokenMat(5), -8, 0.9, 0)
      const outToken = box(0.8, 0.8, 0.8, tokenMat(6), -8, 5.2, 1.6)
      outToken.visible = false
      /* 注意力面板：5 个 token 球 + 连线网 */
      const attnBalls = []
      for (let i = 0; i < 5; i++) {
        attnBalls.push(sph(0.32, tokenMat(i), 8, -8 + (i - 2) * 0.9, 2.2, 3.4))
      }
      const attnLines = []
      const lineGeo = new THREE.BufferGeometry()
      const linePositions = new Float32Array(3 * 2)
      lineGeo.setAttribute("position", new THREE.BufferAttribute(linePositions, 3))
      for (let i = 0; i < 5; i++) {
        for (let j = i + 1; j < 5; j++) {
          const mat = new THREE.LineBasicMaterial({
            color: 0xa78bfa,
            transparent: true,
            opacity: 0.0,
          })
          const line = new THREE.Line(lineGeo.clone(), mat)
          line.frustumCulled = false
          attnLines.push({ line, i, j })
          scene.add(line)
        }
      }

      /* 站 2：自回归序列 */
      const seqTokens = []
      for (let i = 0; i < 10; i++) {
        const t = box(0.85, 0.85, 0.85, tokenMat(i), 2, 2.2, 0)
        t.visible = false
        seqTokens.push(t)
      }
      const seqTray = box(8, 0.3, 1.2, M.towerDark, 2, 1.4, 0)

      /* 站 3：数据瀑布 + 训练塔 */
      const trainTower = box(4, 6, 3, M.tower, 12, 3, 0)
      box(4.4, 0.5, 3.4, M.towerDark, 12, 6.5, 0)
      /* 输出窗 */
      const outWindow = box(3, 1.4, 0.2, M.bar, 12, 4.4, 1.55)
      const outBits = []
      for (let i = 0; i < 5; i++) {
        outBits.push(box(0.45, 0.8, 0.15, tokenMat(i), 12 + (i - 2) * 0.6, 4.4, 1.7))
      }
      /* 进度条 */
      const progBase = box(4.4, 0.3, 0.3, M.towerDark, 12, 6.9, 0)
      const progFill = box(4.2, 0.22, 0.22, M.beam, 12, 6.9, 0)
      progFill.scale.x = 0
      progFill.position.x = 12 - 2.1
      /* 数据瀑布 */
      const dataCubes = []
      for (let i = 0; i < 16; i++) {
        const c = box(0.5, 0.5, 0.5, M.data, 9.5, 0, 0)
        c.userData = { speed: 4 + Math.random() * 3, offset: Math.random() * 10 }
        dataCubes.push(c)
      }

      /* 站 4：老师 + 裁判 */
      function makePerson(matHead, matBody, x, z) {
        const g = new THREE.Group()
        sph(0.45, matHead, 8, 0, 2.6, 0, g)
        box(0.9, 1.4, 0.6, matBody, 0, 1.7, 0, g)
        box(0.9, 0.25, 0.6, matBody, 0, 0.85, 0, g)
        g.position.set(x, 0, z)
        scene.add(g)
        return g
      }
      const teacher = makePerson(M.teacher, M.teacher, 22, 1.2)
      const judge = makePerson(M.judge, M.judge, 22, -1.6)
      const demoBoard = box(1.8, 1.1, 0.2, M.bar, 22.8, 2.2, 1.2)
      const demoBits = []
      for (let i = 0; i < 3; i++) {
        demoBits.push(box(0.4, 0.5, 0.08, tokenMat(i), 22.8 + (i - 1) * 0.55, 2.2, 1.32))
      }
      const checkMark = new THREE.Group()
      box(0.7, 0.18, 0.18, M.good, 0.15, -0.15, 0, checkMark)
      box(0.18, 0.18, 0.5, M.good, -0.15, -0.35, 0, checkMark)
      checkMark.position.set(22.9, 3.6, -1.6)
      scene.add(checkMark)
      const crossMark = new THREE.Group()
      box(0.7, 0.18, 0.18, M.bad, 0, 0, 0, crossMark)
      box(0.7, 0.18, 0.18, M.bad, 0, 0, 0, crossMark)
      crossMark.children[0].rotation.z = Math.PI / 4
      crossMark.children[1].rotation.z = -Math.PI / 4
      crossMark.position.set(22.9, 3.6, -1.6)
      scene.add(crossMark)
      const alignOut = box(0.8, 0.8, 0.8, M.bad, 22, 2.2, -1.6)

      /* ---------- 阶段标签（CSS 投影） ---------- */
      const labelEls = stations.map((s) => {
        const el = document.createElement("div")
        el.className = "stage-label"
        el.textContent = s.name
        container.appendChild(el)
        return el
      })

      /* ---------- 状态机 ---------- */
      const STAGES = [
        {
          x: -18,
          title: "1 分词切割：句子 → token",
          text: "文字进入模型前要先被切成 token（词的碎片）。输入「猫喜欢吃鱼」被切割成 5 个彩色块，每个块映射为一个整数编号——神经网络只吃数字。查看笔记：",
          link: "/learning/llm/tokenization",
        },
        {
          x: -8,
          title: "2 Transformer：自注意力让词互相对话",
          text: "token 进入多层 Transformer 塔逐层提炼。右侧面板演示自注意力：5 个 token 之间连线亮起，每个词都吸收上下文里相关信息（Q 问、K 答、V 提供内容）。查看笔记：",
          link: "/learning/llm/transformer-inference",
        },
        {
          x: 2,
          title: "3 自回归生成：一次只出一个词",
          text: "塔顶吐出一个新 token，追加到序列尾部，整段重新计算、再吐下一个——循环下去就长出一整段回答。生成 1000 个 token 就是把这套流程循环 1000 遍。查看笔记：",
          link: "/learning/llm/transformer-inference",
        },
        {
          x: 12,
          title: "4 预训练：在文本海洋里学会预测",
          text: "数据块瀑布般涌入训练塔，目标只有一个——预测下一个 token。随着训练推进（进度条），输出从乱码色块变得有序：语法、知识、推理都是「学会预测」的副产物。查看笔记：",
          link: "/learning/llm/pre-training",
        },
        {
          x: 22,
          title: "5 对齐：把补全机器调教成助手",
          text: "绿色老师举着示范牌做 SFT 指令微调；金色裁判给出红叉（差回答）与绿勾（好回答），对应 RLHF/DPO 的偏好学习。对齐改变行为而非知识。查看笔记：",
          link: "/learning/llm/alignment",
        },
      ]
      const panelTitle = document.getElementById("panel-title")
      const panelText = document.getElementById("panel-text")
      let stage = 0
      let playing = true
      let simTime = 0

      function showStage(i) {
        stage = (i + STAGES.length) % STAGES.length
        const s = STAGES[stage]
        panelTitle.textContent = s.title
        panelText.innerHTML = s.text + ` <a href="${s.link}">${s.link}</a>`
        document.querySelectorAll(".stage-pill").forEach((el) => {
          el.classList.toggle("active", Number(el.dataset.stage) === stage)
        })
        simTime = 0
      }
      document.querySelectorAll(".stage-pill").forEach((el) => {
        el.addEventListener("click", () => showStage(Number(el.dataset.stage)))
      })
      document.getElementById("btn-prev").addEventListener("click", () => showStage(stage - 1))
      document.getElementById("btn-next").addEventListener("click", () => showStage(stage + 1))
      document.getElementById("btn-play").addEventListener("click", () => {
        playing = !playing
        document.getElementById("btn-play").textContent = playing ? "暂停" : "继续"
      })
      showStage(0)

      /* ---------- 各阶段动画 ---------- */
      function updateStage0(t) {
        const cyc = t % 9
        sentenceBar.visible = cyc < 5.5
        if (cyc < 2) {
          sentenceBar.position.y = 6 - cyc
          bladeA.position.y = 3.4
          bladeB.position.y = 3.4
        } else if (cyc < 5.5) {
          const k = (cyc - 2) / 3.5
          sentenceBar.position.y = 4 - 2 * k
          const bladeY = 3.4 - k * 2.6
          bladeA.position.y = bladeY + Math.sin(t * 30) * 0.05
          bladeB.position.y = bladeY + Math.sin(t * 30 + 1) * 0.05
        }
        for (let i = 0; i < 5; i++) {
          const appear = 5.5 + i * 0.25
          if (cyc < appear) {
            tokens0[i].visible = false
            continue
          }
          tokens0[i].visible = true
          const k = Math.min(1, (cyc - appear) / 0.7)
          const ease = 1 - Math.pow(1 - k, 3)
          tokens0[i].position.x = -18 + (i - 2) * 1.15
          tokens0[i].position.y = 3.2 - ease * 1.6 + (cyc > 7 ? Math.sin(t * 5 + i) * 0.06 : 0)
          tokens0[i].rotation.y = ease * 0.8
        }
      }

      function updateStage1(t) {
        const cyc = t % 8
        const k = Math.min(1, cyc / 6)
        currentToken.position.y = 0.9 + k * 3.6
        currentToken.rotation.y = t * 2
        tower1.rotation.y = t * 0.25
        outToken.visible = cyc > 6
        if (outToken.visible) {
          outToken.position.y = 5.2 + Math.sin(t * 3) * 0.1
          outToken.rotation.y = t * 2
        }
        attnBalls.forEach((b, i) => {
          b.position.y = 2.2 + Math.sin(t * 2 + i) * 0.15
        })
        attnLines.forEach(({ line, i, j }, idx) => {
          const pos = line.geometry.attributes.position
          pos.setXYZ(0, attnBalls[i].position.x, attnBalls[i].position.y, 3.4)
          pos.setXYZ(1, attnBalls[j].position.x, attnBalls[j].position.y, 3.4)
          pos.needsUpdate = true
          const pulse = Math.max(0, Math.sin(t * 2.2 - idx * 0.6))
          line.material.opacity = 0.55 * pulse
        })
      }

      function updateStage2(t) {
        const cyc = t % 10
        seqTokens.forEach((tok, i) => {
          const appear = i * 0.9
          tok.visible = cyc >= appear && cyc < 8.6
          if (tok.visible) {
            const grow = cyc < appear + 0.35 ? (cyc - appear) / 0.35 : 1
            tok.scale.setScalar(0.4 + 0.6 * Math.min(1, grow))
            tok.position.x = 2 - 3.6 + i * 0.8
            tok.position.y = 2.2 + Math.sin(t * 3 + i) * 0.07
            if (cyc > 7.5 && cyc < 8.6) tok.position.z = (cyc - 7.5) * 3
          }
        })
      }

      function updateStage3(t) {
        const cyc = t % 10
        /* 数据瀑布 */
        dataCubes.forEach((c) => {
          const local = (t * c.userData.speed + c.userData.offset) % 11
          c.position.y = 9.5 - local
          c.position.x = 9.5 + Math.sin(local * 1.7 + c.userData.offset) * 1.6
          c.position.z = (c.userData.offset % 3) - 1
          c.rotation.x += 0.02
          c.rotation.y += 0.03
        })
        /* 进度条 */
        const prog = cyc / 10
        progFill.scale.x = Math.max(0.0001, prog)
        progFill.position.x = 12 - 2.1 + 2.1 * prog
        /* 输出从乱码变有序 */
        outBits.forEach((bit, i) => {
          const orderK = Math.max(0, Math.min(1, (cyc - 3) / 3))
          if (cyc < 3) {
            bit.position.y = 4.4 + Math.sin(t * 8 + i * 2.4) * 0.35
            bit.position.x = 12 + (i - 2) * 0.6 + Math.sin(t * 6 + i) * 0.5
          } else {
            const ease = 1 - Math.pow(1 - orderK, 3)
            bit.position.y = 4.4 + (1 - ease) * Math.sin(t * 8 + i * 2.4) * 0.35
            bit.position.x = 12 + (i - 2) * 0.6 + (1 - ease) * Math.sin(t * 6 + i) * 0.5
          }
        })
      }

      function updateStage4(t) {
        const cyc = t % 8
        const badPhase = cyc < 3.6
        crossMark.visible = badPhase
        checkMark.visible = !badPhase
        const mk = badPhase ? crossMark : checkMark
        mk.position.y = 3.6 + Math.sin(t * 4) * 0.15
        alignOut.material = badPhase ? M.bad : M.good
        alignOut.position.y = 2.2 + (badPhase ? Math.sin(t * 7) * 0.3 : Math.sin(t * 2) * 0.08)
        alignOut.rotation.y = badPhase ? t * 5 : Math.sin(t) * 0.3
        teacher.rotation.y = Math.sin(t) * 0.15
        judge.rotation.y = Math.sin(t * 0.8) * 0.2
        demoBits.forEach((b, i) => {
          b.position.y = 2.2 + Math.sin(t * 2 + i) * 0.08
        })
      }

      const updaters = [updateStage0, updateStage1, updateStage2, updateStage3, updateStage4]

      /* ---------- 主循环 ---------- */
      const clock = new THREE.Clock()
      const targetV = new THREE.Vector3(0, 2, 0)

      function animate() {
        requestAnimationFrame(animate)
        const dt = clock.getDelta()
        if (playing) simTime += dt
        updaters[stage](simTime)
        /* 相机跟随当前站 */
        targetV.x += (STAGES[stage].x - targetV.x) * 0.06
        controls.target.copy(targetV)
        controls.update()
        /* 标签投影 */
        labelEls.forEach((el, i) => {
          const p = new THREE.Vector3(stations[i].x, stations[i].y, 0).project(camera)
          const visible = p.z < 1
          el.style.display = visible ? "block" : "none"
          el.style.left = (0.5 + p.x * 0.5) * container.clientWidth + "px"
          el.style.top = (0.5 - p.y * 0.5) * container.clientHeight + "px"
        })
        renderer.render(scene, camera)
      }
      animate()

      /* ---------- 响应式 ---------- */
      window.addEventListener("resize", () => {
        camera.aspect = container.clientWidth / container.clientHeight
        camera.updateProjectionMatrix()
        renderer.setSize(container.clientWidth, container.clientHeight)
      })
    </script>
  </body>
</html>
